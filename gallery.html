<main>
  <section class="page-hero">
    <img class="page-hero__media" src="assets/img/page-hero/gallery.jpg" alt="ADELE MOON performing live" data-i18n-attr="alt">
    <div class="page-hero__scrim"></div>
    <h1 class="page-hero__title" data-i18n>Gallery</h1>
  </section>

  <section class="section" id="gallery">
    <div class="container">
      <div class="gallery__grid gallery__grid--feature">
        <button class="gallery__item" type="button" data-lightbox-item data-caption="Adele Moon on the coast of Cyprus" data-i18n-attr="data-caption">
          <img class="media" src="assets/img/adele/portrait.jpg" alt="Adele Moon on the coast of Cyprus" loading="lazy" data-i18n-attr="alt">
        </button>
        <button class="gallery__item" type="button" data-lightbox-item data-caption="Adele Moon behind the decks at Tulum Beach Bar" data-i18n-attr="data-caption">
          <img class="media" src="assets/img/adele/tulum-heart.jpg" alt="Adele Moon behind the decks at Tulum Beach Bar" loading="lazy" data-i18n-attr="alt">
        </button>
        <button class="gallery__item" type="button" data-lightbox-item data-caption="Adele Moon at Nissi Bay Beach Bar" data-i18n-attr="data-caption">
          <img class="media" src="assets/img/adele/nissi-bay.jpg" alt="Adele Moon at Nissi Bay Beach Bar" loading="lazy" data-i18n-attr="alt">
        </button>
        <button class="gallery__item" type="button" data-lightbox-item data-caption="Sunset set at Tulum Beach Bar" data-i18n-attr="data-caption">
          <img class="media" src="assets/img/adele/tulum-sunset.jpg" alt="Sunset set at Tulum Beach Bar" loading="lazy" data-i18n-attr="alt">
        </button>
        <button class="gallery__item" type="button" data-lightbox-item data-caption="Adele Moon laughing during a set at Tulum Beach Bar" data-i18n-attr="data-caption">
          <img class="media" src="assets/img/adele/tulum-laugh.jpg" alt="Adele Moon laughing during a set at Tulum Beach Bar" loading="lazy" data-i18n-attr="alt">
        </button>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" data-lightbox role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer" data-i18n-attr="aria-label">
  <button class="lightbox__nav lightbox__nav--prev" type="button" data-lightbox-prev aria-label="Previous photo" data-i18n-attr="aria-label">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <figure class="lightbox__figure">
    <img class="lightbox__image lightbox__image--placeholder" data-lightbox-image alt="">
    <figcaption class="lightbox__caption">
      <span data-lightbox-caption></span>
      <span data-lightbox-counter></span>
    </figcaption>
  </figure>
  <button class="lightbox__nav lightbox__nav--next" type="button" data-lightbox-next aria-label="Next photo" data-i18n-attr="aria-label">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close" data-i18n-attr="aria-label">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
</div>
